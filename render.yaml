services:
  - type: web
    name: nebulavisuals
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
    disk:
      name: nebuladata
      mountPath: /opt/render/project/src/data
      sizeGB: 1
